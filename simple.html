<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fix the “Book a demo” form · Ziki</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14181F; --ink-2:#2B323D; --muted:#5B6572;
  --bg:#F3F5F7; --surface:#FFFFFF; --line:#E3E7EC; --line-2:#D5DAE1; --ring:#CBD2DA;
  --brand:#4338CA; --brand-ink:#3730A3; --brand-soft:#E0E7FF;
  --warn:#B45309; --warn-ink:#92400E; --warn-soft:#FEF3C7; --warn-wash:#FFFBEB; --warn-line:#F0D58A;
  --ok:#166534; --ok-soft:#DCFCE7; --bad:#B42318;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.55}
button{font:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* App bar: same as the rest of Ziki */
.topbar{display:flex;align-items:center;gap:12px 24px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.brand b{font-size:17px;letter-spacing:-0.01em}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.crumbs .here{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:32px;height:32px;border-radius:10px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}

main{max-width:680px;margin:0 auto;padding:48px 24px 40px}

/* 1. Issue title and status */
.issue{margin-bottom:48px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;line-height:20px}
.pill.needs{background:var(--warn-soft);color:var(--warn-ink)}
.pill.work{background:var(--brand-soft);color:var(--brand-ink)}
h1{margin:14px 0 0;font-size:28px;line-height:1.25;letter-spacing:-0.02em;font-weight:700}
.summary{margin:10px 0 0;font-size:17px;color:var(--ink-2)}

/* 2. Timeline */
.progress{margin-bottom:40px}
.progress h2{margin:0 0 22px;font-size:18px;font-weight:700;letter-spacing:-0.01em}
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;gap:16px}
.rail{display:flex;flex-direction:column;align-items:center;flex:0 0 36px}
.node{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.node.done{background:var(--line);color:var(--ink)}
.node.now-wait{background:var(--warn);color:#fff;box-shadow:0 0 0 4px var(--warn-soft)}
.node.now-work{background:var(--brand);color:#fff;box-shadow:0 0 0 4px var(--brand-soft)}
.node.next{border:2px solid var(--ring);background:transparent}
.line{flex:1;width:0;min-height:20px;margin:8px 0;border-left:2px solid var(--line-2)}
.step.is-now .line,.step.is-next .line{border-left-style:dashed}
.step:last-child .line{display:none}
.body{flex:1;min-width:0;padding:5px 0 30px}
.step:last-child .body{padding-bottom:0}
.now-tag{margin-bottom:2px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.now-tag.wait{color:var(--warn-ink)}
.now-tag.work{color:var(--brand-ink)}
.s-title{margin:0;font-size:17px;line-height:1.4;font-weight:600}
.is-now .s-title{font-size:19px;font-weight:700}
.is-next .s-title{color:var(--muted)}
.s-desc{margin:4px 0 0;font-size:15px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:8px;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:600;line-height:20px}

/* 3. The one decision card */
.card{border-radius:16px;padding:26px}
.card.ask{background:var(--warn-wash);border:1.5px solid var(--warn)}
.card.result{background:var(--surface);border:1px solid var(--line)}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn-ink)}
.card h2{margin:0;font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-0.01em}
.card h2:focus{outline:none}
.card p{margin:10px 0 0;color:var(--ink-2)}
.card .note{font-size:14px;color:var(--muted)}
.result h2{display:flex;align-items:center;gap:10px}
.result .ico{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ico.ok{background:var(--brand-soft);color:var(--brand-ink)}
.ico.stop{background:var(--line);color:var(--ink)}
.change{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;margin-top:18px}
.cell{flex:1 1 200px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--warn-line)}
.cell.after{background:#EEF2FF;border-color:#C7D2FE}
.cell small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.cell.after small{color:var(--brand-ink)}
.cell strong{display:block;font-size:15px;font-weight:600;word-break:break-all}
.arrow{align-self:center;color:var(--muted);display:flex}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--brand);color:#fff;border:1px solid var(--brand)}
.btn.primary:hover{background:var(--brand-ink)}
.btn.reject{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn.reject:hover{background:#FEF3F2}

.foot{margin:48px 0 0;text-align:center;font-size:13px;color:var(--muted)}

@media (max-width:520px){
  .topbar{padding:10px 16px}
  main{padding:32px 20px 32px}
  h1{font-size:24px}
  .card{padding:20px}
  .card h2{font-size:20px}
  .btn{flex:1 1 100%}
  .arrow{flex:1 1 100%;justify-content:center;height:16px;align-items:center}
  .arrow svg{transform:rotate(90deg)}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="mark" aria-hidden="true">Z</div><b>Ziki</b></div>
  <nav class="crumbs" aria-label="Breadcrumb"><span>Issues</span><span aria-hidden="true">/</span><span class="here">Fix the “Book a demo” form</span></nav>
  <span class="avatar" title="Amara Okafor">AO</span>
</div>

<main>
  <!-- 1. Issue title and current status -->
  <section class="issue" aria-labelledby="issue-title">
    <span class="pill" id="pill"></span>
    <h1 id="issue-title">Fix the “Book a demo” form so requests reach Sales</h1>
    <p class="summary" id="summary"></p>
  </section>

  <!-- 2. What the agent has done, is doing, and will do -->
  <section class="progress" aria-labelledby="progress-h">
    <h2 id="progress-h">Progress</h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <!-- 3. One decision, only when the agent needs it -->
  <div id="card"></div>

  <p class="foot">Design preview with sample content.</p>
</main>

<script>
(function () {
  var svg = function (d, size, sw) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 2.4) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  };
  var ICONS = {
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    warn: '<path d="M12 4l9 15.5H3L12 4z"/><path d="M12 10v4.5M12 17.5v.01"/>',
    spin: '<path d="M12 3a9 9 0 1 1-9 9"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    shield: '<path d="M12 3l7 2.8v5.6c0 4.4-2.9 7.7-7 9.6-4.1-1.9-7-5.2-7-9.6V5.8L12 3z"/><path d="M8.8 12.2l2.2 2.2 4.2-4.4"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>'
  };
  var icon = function (name, size) { return svg(ICONS[name], size || 18); };

  var NODE = { done: ['done', 'check'], wait: ['now-wait', 'warn'], work: ['now-work', 'spin'], stop: ['done', 'x'], next: ['next', ''] };
  var SR = { done: 'done', wait: 'needs your approval', work: 'in progress', stop: 'stopped', next: 'up next' };

  var DONE_1 = { s: 'done', t: 'Agent started work', d: 'Nia picked up this issue and found that 14 of 47 form requests never reached Sales.', meta: '9:12 am', verified: true };
  var DONE_2 = { s: 'done', t: 'Tests passed', d: 'The new sender address worked in 3 of 3 tests on a copy of your form.', meta: '9:41 am', verified: true };
  var RESOLVED = { s: 'next', t: 'Issue resolved', d: 'You’ll see the final result here.', meta: 'Up next' };

  var CARD_ASK =
    '<section class="card ask" aria-labelledby="decision-h">' +
      '<p class="eyebrow">Needs your decision</p>' +
      '<h2 id="decision-h" tabindex="-1">Change the sender address on your live form?</h2>' +
      '<p>Sales’ mail provider is turning away emails from your form.</p>' +
      '<div class="change">' +
        '<div class="cell"><small>Now</small><strong>noreply@northwind.example</strong></div>' +
        '<span class="arrow" aria-hidden="true">' + icon('arrow', 18) + '</span>' +
        '<div class="cell after"><small>After you approve</small><strong>hello@northwind.example</strong></div>' +
      '</div>' +
      '<p class="note">Nia says the new address is already set up for your domain.</p>' +
      '<div class="actions">' +
        '<button type="button" class="btn primary" data-go="approved">' + icon('check', 18) + 'Approve change</button>' +
        '<button type="button" class="btn reject" data-go="rejected">' + icon('x', 18) + 'Reject</button>' +
      '</div>' +
      '<p class="note">Nothing on your live site changes until you approve. You can undo it afterwards.</p>' +
    '</section>';

  var STATES = {
    waiting: {
      pill: ['needs', 'warn', 'Needs your approval'],
      summary: 'Nia, your agent, is fixing this and needs one decision from you.',
      steps: [
        DONE_1, DONE_2,
        { s: 'wait', t: 'Waiting for your approval', d: 'Nia needs your OK before changing your live form.', meta: 'Since 9:41 am' },
        { s: 'next', t: 'Checking the fix', d: 'After you approve, Nia checks that emails now reach Sales.', meta: 'Up next' },
        RESOLVED
      ],
      card: CARD_ASK
    },
    approved: {
      pill: ['work', 'spin', 'In progress'],
      summary: 'Nia, your agent, is checking the fix.',
      steps: [
        DONE_1, DONE_2,
        { s: 'done', t: 'You approved the change', d: 'Nia has applied it to your live form.', meta: '9:44 am' },
        { s: 'work', t: 'Checking the fix', d: 'Nia is sending a test request to make sure emails reach Sales.', meta: 'Started just now' },
        RESOLVED
      ],
      card:
        '<section class="card result" aria-labelledby="decision-h">' +
          '<h2 id="decision-h" tabindex="-1"><span class="ico ok">' + icon('check', 18) + '</span>You approved this change</h2>' +
          '<p>Nia has changed the sender address and is now checking that emails reach Sales. You can undo it afterwards.</p>' +
        '</section>'
    },
    rejected: {
      pill: ['work', 'spin', 'In progress'],
      summary: 'Nia, your agent, is writing up the steps for you.',
      steps: [
        DONE_1, DONE_2,
        { s: 'stop', t: 'You rejected the change', d: 'Nothing on your live form was changed.', meta: '9:44 am' },
        { s: 'work', t: 'Writing up the steps', d: 'Nia is preparing instructions so you can make the change yourself.', meta: 'Started just now' },
        { s: 'next', t: 'Issue resolved', d: 'Once the change is made, you’ll see the result here.', meta: 'Up next' }
      ],
      card:
        '<section class="card result" aria-labelledby="decision-h">' +
          '<h2 id="decision-h" tabindex="-1"><span class="ico stop">' + icon('x', 16) + '</span>You rejected this change</h2>' +
          '<p>Your live form hasn’t been touched. Nia will write up the steps so you can make the change yourself.</p>' +
        '</section>'
    }
  };

  var stepHTML = function (st) {
    var n = NODE[st.s];
    var isNow = st.s === 'wait' || st.s === 'work';
    var isDone = st.s === 'done' || st.s === 'stop';
    var nowTag = isNow ? '<div class="now-tag ' + st.s + '">' + (st.s === 'wait' ? 'Now · needs you' : 'Now') + '</div>' : '';
    var tag = st.verified ? '<span class="tag">' + icon('shield', 14) + 'Verified by Ziki</span>' : '';
    var meta = (st.meta || tag) ? '<div class="meta">' + (st.meta ? '<span>' + st.meta + '</span>' : '') + tag + '</div>' : '';
    return '<li class="step ' + (isDone ? 'is-done' : isNow ? 'is-now' : 'is-next') + '">' +
      '<div class="rail"><span class="node ' + n[0] + '">' + (n[1] ? icon(n[1], 18) : '') + '</span><span class="line"></span></div>' +
      '<div class="body">' + nowTag +
        '<h3 class="s-title">' + st.t + '<span class="sr"> (' + SR[st.s] + ')</span></h3>' +
        '<p class="s-desc">' + st.d + '</p>' + meta +
      '</div></li>';
  };

  var $ = function (id) { return document.getElementById(id); };
  var render = function (key) {
    var S = STATES[key];
    $('pill').className = 'pill ' + S.pill[0];
    $('pill').innerHTML = icon(S.pill[1], 14) + S.pill[2];
    $('summary').textContent = S.summary;
    $('steps').innerHTML = S.steps.map(stepHTML).join('');
    $('card').innerHTML = S.card;
  };

  $('card').addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (!b) return;
    render(b.getAttribute('data-go'));
    var h = $('decision-h');
    if (h) h.focus({ preventScroll: true });
  });

  render('waiting');
})();
</script>
</body>
</html>
