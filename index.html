<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agent Work Recovery · Interactive demo for Ziki</title>
<meta name="description" content="A clickable proposal demo: how work continues when one agent hands a task to another. Simulated, with example data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">

</head>
<body>
<header class="top">
  <a class="brand" href="#/" data-key="brand" aria-label="ziki, demo home">ziki</a>
  <span class="badge">Interactive demo</span>
  <span class="crumb">Shop Checkout · Tasks</span>
  <span class="spacer"></span>
  <button class="btn quiet" type="button" data-action="about" data-key="about">About</button>
  <button class="btn" type="button" data-action="reset" data-key="reset">Reset demo</button>
</header>
<p class="strip">Simulated demo with example data. Nothing here is connected to Ziki. Open each task to try a different part of Agent Work Recovery.</p>

<div id="app" class="app" data-view="both"></div>

<dialog id="dlg" class="dlg" aria-labelledby="dlg-title"></dialog>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<noscript><p class="strip">This demo needs JavaScript.</p></noscript>
<script src="assets/demo.js"></script>
</body>
</html>
